name: Tests

on:
  push:
    branches: [ main, 1.x, 2.x ]
  pull_request:
    branches: [ main, 1.x, 2.x ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # The runner-base image ships PHP 8.3/8.4/8.5 only. PHP 8.2 coverage
        # stays on the GitHub Actions matrix, which runs on GitHub-hosted
        # runners.
        php: [8.3]
        laravel: [11.*, 12.*]
        dependency-version: [prefer-stable]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies
        # Versioned PHP binaries are called explicitly per the runner job
        # contract; the bare `php` symlink is not reliable in runner-base.
        #
        # --no-blocking: Composer 2.10+ refuses to resolve releases with open
        # security advisories. EOL Laravel lines will always carry some, so the
        # compat matrix is unresolvable without opting out. CI-only: this does
        # not relax constraints for anyone installing this package. Drop the
        # flag once the matrix no longer tests EOL framework versions.
        run: |
          php${{ matrix.php }} /usr/local/bin/composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          php${{ matrix.php }} /usr/local/bin/composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-blocking

      - name: Run tests
        run: php${{ matrix.php }} vendor/bin/pest
